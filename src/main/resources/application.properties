spring.application.name=kilasy
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/kilasy
spring.datasource.username=kilasy
spring.datasource.password=kilasy

# The SQL scripts are idempotent: the schema and the demo data are created only if missing
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.mail.host=localhost
spring.mail.port=1025

# Set to true to simulate an SMS provider outage (used to test that grading still succeeds)
kilasy.sms.fail=false
